<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Taskboard{% endblock %}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 32px 16px;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    .email-container {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    .email-header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      padding: 32px 24px;
      text-align: center;
    }
    .email-header h1 {
      color: #ffffff;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .email-header p {
      color: #bfdbfe;
      margin: 6px 0 0 0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .email-body {
      padding: 32px 28px;
    }
    .email-body h2 {
      font-size: 20px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 12px;
      color: #0f172a;
    }
    .email-body p {
      font-size: 15px;
      line-height: 1.6;
      color: #475569;
      margin: 0 0 16px 0;
    }
    .btn-container {
      text-align: center;
      margin: 32px 0;
    }
    .btn {
      background-color: #2563eb;
      color: #ffffff;
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      display: inline-block;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .fallback-link {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      margin-top: 24px;
      word-break: break-all;
    }
    .fallback-link a {
      color: #2563eb;
      text-decoration: underline;
    }
    .divider {
      border: none;
      border-top: 1px solid #f1f5f9;
      margin: 28px 0;
    }
    .email-footer {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="email-header">
      <h1>Taskboard</h1>
      <p>{% block header_subtitle %}Team Workspace{% endblock %}</p>
    </div>
    <div class="email-body">
      {% block content %}{% endblock %}
      <hr class="divider">
      <p class="email-footer">
        {% block footer %}{% endblock %}
      </p>
    </div>
  </div>
</body>
</html>
