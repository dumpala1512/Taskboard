[project]
name = "taskboard-backend"
version = "0.1.0"
description = "Internal Team Task Board Backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "jinja2>=3.1.6",
    "jinjax>=0.68",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
